version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: diptrix_postgres
    environment:
      POSTGRES_USER: diptrix_user
      POSTGRES_PASSWORD: diptrix_password
      POSTGRES_DB: diptrix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diptrix_user -d diptrix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: diptrix_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
